services:

  jesmond-redis:
    image: redis:7-alpine
    container_name: jesmond-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - jesmond-redis-data:/data
    networks:
      - jesmond-network

  jesmond-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jesmond-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3301:3001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_HOST: jesmond-redis
      REDIS_PORT: 6379
    depends_on:
      - jesmond-redis
    networks:
      - jesmond-network

  jesmond-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: jesmond-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      - jesmond-api
    networks:
      - jesmond-network

networks:
  jesmond-network:
    external: true

volumes:
  jesmond-redis-data:
    external: true
