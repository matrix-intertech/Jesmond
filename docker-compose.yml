version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jesmond-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jesmond
    ports:
      - '5432:5432'
    volumes:
      - jesmond_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jesmond-redis
    ports:
      - '6379:6379'
    volumes:
      - jesmond_redis_data:/data
    restart: unless-stopped

volumes:
  jesmond_db_data:
  jesmond_redis_data:
